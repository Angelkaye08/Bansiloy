<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head> 
    <body>
        <div class="flex"> 
            <div class="flex-1 bg-gray-100 h-screen items-center justify-center p-10">
                <div class="mt-36">
                    <img src="picsur.webp" alt="logo" class="w-16 h-16 mx-auto">
                </div>
                <div class="mb-4"> 
                    <h1 class="text-2x1 font-bold text-black-500 items-center justify-center">Login </h1>
                </div>
                <div> 
                    <input type="text" name="" id="" class="w-full rounded-x1 border-2 py-3 p1-10 pr-4 text-sm outline-none transition-all duration-200 focus:ring-2" placeholder="Username">
                </div>
                <div class="mt-4">
                    <input type="password" name="" id="" class="w-full rounded-x1 border-2 py-3 p1-10 pr-4 text-sm outline-none transition-all duration-200 focus:ring-2" placeholder="Password">
                </div>
                <div class="mt-4">
                    <button class=" w-full bg-blue-500 hover:bg-green-600 text-white p-2 rounded-x1"> Login </button>
                </div>
            </div>      
            <div id="box" class="flex-1 bg-purple-500 h-screen p-5 flex items-center justify-center">
                <p class="text-white text-xl font-bold" id="msg">Welcome to the purple section!</p> 
                <div class="m-5">
                <button id="btn" class="bg-green-500 text-white p-2 rounded hover:bg-green-600 transition-colors duration-200"> Click me </button>
                <button id="colorBtn" class="bg-yellow-500 text-white p-2 rounded hover:bg-orange-600 transition-colors duration-200"> Change Color </button> 
                </div>
        </div>

</body>
<script src="angel.js"> </script>
</html>
